<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="poolbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2A22"/>
      <stop offset="1" stop-color="#0F1B14"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3DA9FC" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3DA9FC" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#poolbg)"/>

  <!-- Beckenkante -->
  <rect x="90" y="300" width="620" height="520" fill="url(#water)" stroke="#F5F1E8" stroke-width="1.5" stroke-opacity="0.55"/>
  <rect x="120" y="330" width="560" height="460" fill="none" stroke="#F5F1E8" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Fliesenraster im Becken -->
  <g stroke="#F5F1E8" stroke-width="0.4" stroke-opacity="0.22">
    <path d="M90 400 H710 M90 500 H710 M90 600 H710 M90 700 H710"/>
    <path d="M220 300 V820 M350 300 V820 M480 300 V820 M610 300 V820"/>
  </g>

  <!-- Wasserlinie / Reflexe -->
  <g stroke="#F5F1E8" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.5" fill="none">
    <path d="M150 430 q40 -14 80 0 t80 0"/>
    <path d="M420 500 q40 -14 80 0 t80 0"/>
    <path d="M190 640 q40 -14 80 0 t80 0"/>
    <path d="M430 720 q40 -14 80 0 t80 0"/>
  </g>

  <!-- Poolroboter am Boden, mit Bahnspur -->
  <path d="M170 780 C 260 700, 300 760, 380 720 C 470 675, 520 745, 620 700"
        fill="none" stroke="#A8E063" stroke-width="2" stroke-dasharray="7 9" opacity="0.8"/>
  <g transform="translate(620 700)">
    <ellipse cy="16" rx="52" ry="9" fill="#000" opacity="0.35"/>
    <rect x="-44" y="-26" width="88" height="40" rx="13" fill="#0A0F0C" stroke="#F5F1E8" stroke-width="1"/>
    <rect x="-30" y="-18" width="60" height="14" rx="6" fill="#1F2A22"/>
    <circle cx="-24" cy="16" r="8" fill="#0A0F0C" stroke="#F5F1E8" stroke-width="0.8"/>
    <circle cx="24" cy="16" r="8" fill="#0A0F0C" stroke="#F5F1E8" stroke-width="0.8"/>
    <circle cx="0" cy="-6" r="5" fill="#3DA9FC"/>
  </g>

  <!-- Messwerte als Mono-Anmutung -->
  <g fill="#F5F1E8" opacity="0.85" font-family="monospace">
    <text x="60" y="120" font-size="11" letter-spacing="3">VI · POOL</text>
    <text x="60" y="240" font-size="12" letter-spacing="2" opacity="0.7">PH 7.2 · CL 0.6 MG/L</text>
  </g>
</svg>
