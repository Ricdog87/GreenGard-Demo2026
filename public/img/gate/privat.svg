<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="pv-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B87333" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#D8D4C8"/>
      <stop offset="1" stop-color="#F5F1E8"/>
    </linearGradient>
    <linearGradient id="pv-lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C7A5E"/>
      <stop offset="1" stop-color="#1F2A22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="330" fill="url(#pv-sky)"/>
  <rect y="330" width="800" height="220" fill="url(#pv-lawn)"/>

  <!-- Wohnhaus mit warmem Fensterlicht -->
  <g opacity="0.92">
    <rect x="80" y="150" width="210" height="180" fill="#0F1B14"/>
    <polygon points="80,150 185,88 290,150" fill="#0A0F0C"/>
    <rect x="120" y="200" width="42" height="52" fill="#B87333" opacity="0.85"/>
    <rect x="196" y="200" width="42" height="52" fill="#B87333" opacity="0.6"/>
    <rect x="158" y="272" width="46" height="58" fill="#1F2A22"/>
  </g>

  <!-- Hecke, sitzt auf der Rasenkante -->
  <g fill="#0F1B14" opacity="0.55">
    <rect x="330" y="296" width="440" height="44" rx="20"/>
  </g>

  <!-- Versenkregner mit Sprühfächer -->
  <g transform="translate(470 400)">
    <g stroke="#F5F1E8" stroke-width="2" stroke-linecap="round" opacity="0.95" fill="none">
      <path d="M0 -8 C -50 -60, -110 -78, -170 -70"/>
      <path d="M0 -8 C -40 -78, -80 -110, -130 -122"/>
      <path d="M0 -8 C -14 -84, -6 -122, 12 -140"/>
      <path d="M0 -8 C 40 -78, 84 -108, 136 -118"/>
      <path d="M0 -8 C 54 -58, 116 -74, 174 -64"/>
    </g>
    <rect x="-9" y="-8" width="18" height="62" rx="4" fill="#0A0F0C"/>
    <ellipse cx="0" cy="-9" rx="11" ry="4.5" fill="#3DA9FC"/>
    <ellipse cx="0" cy="56" rx="26" ry="6" fill="#0A0F0C" opacity="0.45"/>
  </g>

  <!-- Rasenstruktur -->
  <g stroke="#5C7A5E" stroke-width="16" opacity="0.22">
    <path d="M-20 370 H820 M-20 410 H820 M-20 450 H820 M-20 490 H820 M-20 530 H820"/>
  </g>
</svg>
