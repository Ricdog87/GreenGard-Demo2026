<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 326" role="img" aria-label="GREEN-GARD">
  <!--
    Green-Gard Wortmarke, nachgebaut nach der Originaldatei des Kunden
    ("Green Gard Logo ohne grau", pixelvermessen am 12.08.2026):

    - Zwei VERZAHNTE Boegen: der linke Fuss des hellen Bogens sitzt exakt hinter
      dem rechten Fuss des dunklen (Mittenabstand = R + r = 107 + 59), dunkel
      liegt oben. Die Ueberlappung ist also gewollt - nur Mass und Lage muessen
      stimmen.
    - Farben aus dem Original: Dunkelgruen #006943, Hellgruen #009353.
    - Wortmarke: "GREEN-" dunkel (inkl. Bindestrich), "GARD" hell.
    - Ein <text> mit tspans plus textLength: als <img> geladen kennt das SVG
      die Webfont nicht; textLength haelt die Laufweite in jeder Rueckfallschrift.

    18.08.2026: Die Schwenk-Animation ist wieder raus - beim Kippen hoben die
    flachen Bogenfuesse von der Grundlinie ab und das Logo wirkte
    "abgeschnitten" (Feedback Jan). Das Logo steht jetzt ruhig, exakt wie die
    Originaldatei.

    TODO: durch die Original-Vektordatei ersetzen, sobald sie vorliegt.
  -->

  <!-- heller Bogen hinten -->
  <path fill="#009353"
        d="M556 126 A107 107 0 0 1 770 126 L722 126 A59 59 0 0 0 604 126 Z" />
  <!-- dunkler Bogen vorn -->
  <path fill="#006943"
        d="M389 126 A107 107 0 0 1 603 126 L555 126 A59 59 0 0 0 437 126 Z" />

  <text x="60" y="304"
        font-family="'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="800" font-size="170"
        textLength="1037" lengthAdjust="spacingAndGlyphs">
    <tspan fill="#006943">GREEN-</tspan><tspan fill="#009353">GARD</tspan>
  </text>
</svg>
